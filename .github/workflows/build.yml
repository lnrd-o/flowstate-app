name: Build

# Builds installers for Windows, macOS (arm64 + x64) and Linux. Pushing a tag v* (e.g. v0.2.0) also creates a DRAFT
# GitHub Release with every artifact attached; nothing is public until you review and publish the draft.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build: npm run dist:win
            artifacts: |
              dist/*.exe
          - name: macos-arm64
            os: macos-latest
            build: npm run dist:mac -- --arm64
            artifacts: |
              dist/*.dmg
              dist/*.zip
          # macos-13 was retired by GitHub; macos-15-intel is the remaining Intel (x64) macOS runner.
          - name: macos-x64
            os: macos-15-intel
            build: npm run dist:mac -- --x64
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - name: linux-x64
            os: ubuntu-latest
            build: npm run dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Package
        run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: flowstate-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
